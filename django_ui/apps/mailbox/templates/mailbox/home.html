<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; }
      .card { max-width: 720px; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
      code { background: #f2f2f2; padding: 0.2rem 0.4rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>{{ title }}</h1>
      <p>Front-end Django activo. Estado gRPC: <code>{{ status }}</code></p>
      <p>Siguiente paso: login/registro y bandejas conectadas por gRPC.</p>
    </div>
  </body>
</html>
